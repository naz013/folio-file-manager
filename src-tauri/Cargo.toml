[package]
name = "folio"
version = "0.1.0"
description = "Folio — a lightweight, beautiful file manager"
authors = ["Folio contributors"]
license = "AGPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5.2.9"
notify-debouncer-mini = "0.7.0"
# Vendored: upstream `drag` offers copy or move but not both at once (see vendor/drag/FOLIO.md).
drag = { path = "vendor/drag" }
png = "0.18.1"
percent-encoding = "2.3.2"
# Deadlines for calls to slow disks; the runtime is the one tauri already uses.
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
jwalk = "0.9"
rusqlite = { version = "0.41.1", features = ["bundled"] }
blake3 = "1.8.7"
lopdf = "0.46"
# Zip archives; deflate (and deflate64), through the flate2 the image crates already bring.
zip = { version = "9", default-features = false, features = ["deflate-flate2", "deflate64"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Registry", "Win32_System_Time"] }

# Lints for every target. `npm run lint` and CI run clippy with -D warnings, so these are enforced.
# See docs/CODE_STYLE.md for the reasoning behind each allowance.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
# Pedantic lints that don't fit this codebase:
# - Tauri commands return `Result<T, String>` by design; error docs would repeat the type.
missing_errors_doc = "allow"
# - Every public fn here is internal to the app; #[must_use] everywhere is noise.
must_use_candidate = "allow"
