<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>JSON viewer</title>
    <style>
      :root {
        --line: color-mix(in srgb, CanvasText 14%, transparent);
        --dim: color-mix(in srgb, CanvasText 50%, transparent);
        --hit: color-mix(in srgb, gold 45%, transparent);
        --cur: color-mix(in srgb, orange 75%, transparent);
        --sel: color-mix(in srgb, CanvasText 10%, transparent);
        --key: light-dark(#0b5cad, #7cb7ff);
        --str: light-dark(#0a7d33, #8fd19e);
        --num: light-dark(#b45309, #f0b27a);
        --lit: light-dark(#7c3aed, #c4a1ff);
        --bad: light-dark(#b00020, #ff8a80);
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: Canvas;
        color: CanvasText;
        font:
          13px system-ui,
          sans-serif;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
      }
      .bar input[type="search"] {
        flex: 1;
        min-width: 80px;
        max-width: 260px;
        padding: 4px 8px;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      button {
        padding: 3px 8px;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button[aria-pressed="true"] {
        background: var(--hit);
      }
      .seg {
        display: inline-flex;
      }
      .seg button {
        border-radius: 0;
        margin-left: -1px;
      }
      .seg button:first-child {
        border-radius: 6px 0 0 6px;
        margin-left: 0;
      }
      .seg button:last-child {
        border-radius: 0 6px 6px 0;
      }
      .count,
      .info {
        color: var(--dim);
        white-space: nowrap;
      }
      .spacer {
        flex: 1;
      }
      .callout {
        margin: 0;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bad) 12%, transparent);
      }
      .callout.note {
        background: var(--sel);
      }
      .callout b {
        color: var(--bad);
      }
      .callout pre {
        margin: 6px 0 0;
        font:
          12px/1.4 ui-monospace,
          "Cascadia Mono",
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
      #view {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 6px 0;
        font:
          12.5px/1.55 ui-monospace,
          "Cascadia Mono",
          Consolas,
          monospace;
        tab-size: 2;
      }
      .space {
        position: relative;
      }
      .row {
        position: absolute;
        left: 0;
        display: flex;
        align-items: baseline;
        box-sizing: border-box;
        height: 21px;
        width: max-content;
        min-width: 100%;
        padding-right: 12px;
        white-space: pre;
      }
      #view.tree:focus-visible {
        outline: 2px solid Highlight;
        outline-offset: -2px;
      }
      .row:hover {
        background: var(--sel);
      }
      .row.sel {
        background: var(--sel);
        outline: 1px solid var(--line);
      }
      .row.cur {
        background: color-mix(in srgb, orange 25%, transparent);
      }
      .tg,
      .sp {
        flex: none;
        width: 18px;
        padding: 0;
        text-align: center;
        border: 0;
        color: var(--dim);
      }
      .tg:hover {
        color: CanvasText;
      }
      .key,
      .colon {
        flex: none;
      }
      .row > .str,
      .row > .num,
      .row > .lit {
        flex: none;
      }
      .key {
        color: var(--key);
      }
      .str {
        color: var(--str);
      }
      .num {
        color: var(--num);
      }
      .lit {
        color: var(--lit);
      }
      .colon {
        margin-right: 6px;
      }
      .meta {
        margin-left: 8px;
        color: var(--dim);
      }
      .more {
        align-self: center;
        padding: 0 8px;
        line-height: 17px;
      }
      mark {
        color: inherit;
        background: var(--hit);
        border-radius: 2px;
      }
      mark.cur {
        background: var(--cur);
      }
      .line {
        display: flex;
      }
      .line.err {
        background: color-mix(in srgb, var(--bad) 18%, transparent);
      }
      .n {
        flex: none;
        box-sizing: content-box;
        width: calc(var(--digits, 3) * 1ch);
        padding: 0 10px 0 12px;
        text-align: right;
        color: var(--dim);
        user-select: none;
      }
      .t {
        flex: 1;
        padding-right: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .msg {
        padding: 24px;
        color: var(--dim);
        text-align: center;
      }
      select#enc {
        padding: 3px 6px;
        font: inherit;
        color: inherit;
        background: Canvas;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="seg" role="group" aria-label="View">
        <button id="m-tree" aria-pressed="true">Tree</button>
        <button id="m-pretty" aria-pressed="false">Pretty</button>
        <button id="m-raw" aria-pressed="false">Raw</button>
      </div>
      <input id="q" type="search" placeholder="Search (Ctrl+F)" aria-label="Search" />
      <button id="prev" title="Previous match (Shift+Enter)" aria-label="Previous match">↑</button>
      <button id="next" title="Next match (Enter)" aria-label="Next match">↓</button>
      <span id="count" class="count" role="status"></span>
      <span class="spacer"></span>
      <select id="enc"></select>
      <button id="expand" title="Open every level">Expand all</button>
      <button id="collapse" title="Fold everything">Collapse all</button>
      <button id="cpath" title="Copy the path of the selected row" disabled>Copy path</button>
      <button id="cvalue" title="Copy the value of the selected row" disabled>Copy value</button>
    </div>
    <div id="top"></div>
    <div id="view" tabindex="0"><p class="msg">Waiting…</p></div>
    <script src="json.js"></script>
    <script src="encoding.js"></script>
    <script>
      // A file's text is untrusted: it is only ever put on the page with textContent.
      const MAX_HITS = 2000;
      /** Members of an open container shown at once: one window, moved by Next and Previous. */
      const CHUNK = 10000;
      const ROW_H = 21;
      const OVERSCAN = 10;
      const MAX_DEPTH = 400;
      const PAGE = 4 * 1024 * 1024;
      /** The most of a file that is read and parsed: the text and the parsed document are held. */
      const MAX_FILE = 32 * 1024 * 1024;
      /** Above this the document is large: no Pretty view (it would copy the whole of it). */
      const LARGE = 4 * 1024 * 1024;
      /** Lines drawn in the text views; each is an element on the page. */
      const MAX_LINES = 20000;
      /** Characters of a line that are drawn: a minified document is one enormous line. */
      const MAX_WIDTH = 10000;
      const $ = (id) => document.getElementById(id);
      const view = $("view");
      const query = $("q");

      let text = "";
      let truncated = false;
      let fileSize = 0;
      let doc;
      let hasDoc = false;
      let error = null;
      let mode = "raw";
      let expanded = new Set();
      /** Where each open container's window of members starts. */
      let windows = new Map();
      /** The text of the Pretty view, made once for the document. */
      let pretty = null;
      /** The lines of the tree that are open, and where each node's line is. */
      let list = [];
      let lineIndex = new Map();
      let selected = null;
      /** Counts searches: a newer one, or a new view, ends an older one. */
      let searchRun = 0;
      let capped = false;
      let hits = [];
      let current = -1;
      let needle = "";
      let large = false;

      // The page talks to Folio with messages; see docs/PLUGINS.md.
      let nextId = 1;
      const pending = new Map();
      function call(method, params) {
        return new Promise((resolve, reject) => {
          const id = nextId++;
          pending.set(id, { resolve, reject });
          parent.postMessage({ folio: 1, id, method, params }, "*");
        });
      }
      window.addEventListener("message", (e) => {
        const m = e.data;
        if (!m || m.folio !== 1) return;
        if (m.id !== undefined) {
          const waiting = pending.get(m.id);
          pending.delete(m.id);
          if (m.error !== undefined) waiting?.reject(new Error(m.error));
          else waiting?.resolve(m.result);
        } else if (m.event === "preview" && m.preview === "json") {
          open(m.path);
        }
      });

      const el = (tag, cls, txt) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (txt !== undefined) e.textContent = txt;
        return e;
      };
      const { kind, isContainer, pk, pathText } = Json;

      function message(txt) {
        view.className = "";
        view.removeAttribute("role");
        view.removeAttribute("aria-label");
        view.removeAttribute("aria-activedescendant");
        view.replaceChildren(el("p", "msg", txt));
      }

      let chosen = "";
      let opened = "";
      const encSelect = $("enc");
      Enc.fill(encSelect);
      encSelect.addEventListener("change", () => {
        chosen = encSelect.value;
        if (opened) open(opened, true);
      });

      /** Counts opens: a read that returns after a newer open began is dropped. */
      let generation = 0;
      async function open(path, same = false) {
        opened = path;
        if (!same) {
          chosen = "";
          Enc.reset(encSelect);
        }
        const mine = ++generation;
        searchRun++;
        let enc = chosen;
        // Nothing of the file that was shown stays to be drawn over the reading.
        doc = undefined;
        hasDoc = false;
        hits = [];
        current = -1;
        list = [];
        selected = null;
        $("cpath").disabled = $("cvalue").disabled = true;
        try {
          let t = "";
          let at = 0;
          let first = true;
          message("Reading…");
          for (;;) {
            const r = await readPiece(path, at, Math.min(PAGE, MAX_FILE - at), enc, mine);
            if (!r) return;
            if (first) {
              Enc.show(encSelect, r, enc);
              // The rest is read in the encoding the start was found to be in: found again
              // for each piece, it could change part way and mix two.
              enc = enc || r.encoding;
              first = false;
            }
            fileSize = r.size;
            t += r.text;
            const atEnd = r.end >= r.size || r.end <= at;
            at = atEnd ? r.size : r.end;
            if (atEnd || at >= MAX_FILE) break;
            message(
              `Reading… ${(at / 1048576).toFixed(1)} of ${(fileSize / 1048576).toFixed(1)} MB`,
            );
          }
          if (mine !== generation) return;
          // Parsing a big file takes a moment: say so before the page is held up by it.
          if (t.length > LARGE) {
            message("Reading the structure…");
            await new Promise((resolve) => setTimeout(resolve, 20));
            if (mine !== generation) return;
          }
          load(t, at < fileSize);
        } catch (e) {
          if (mine === generation) message(e.message);
        }
      }

      /**
       * One piece of the file. The host limits how many reads a plugin makes in a while: when it
       * says so, wait a moment and ask again.
       */
      async function readPiece(path, offset, length, enc, mine) {
        for (;;) {
          try {
            const r = await call("readRange", {
              path,
              offset,
              length,
              encoding: enc || undefined,
            });
            return mine === generation ? r : null;
          } catch (e) {
            if (!/Too many/.test(e.message) || mine !== generation) throw e;
            await new Promise((resolve) => setTimeout(resolve, 1000));
            if (mine !== generation) return null;
          }
        }
      }

      /** Where the first mistake in `t` is, found by reading it: `{ at, m }`, or null if none. */
      function errorAt(t) {
        let i = 0;
        const ws = () => {
          while (i < t.length && " \t\n\r".includes(t[i])) i++;
        };
        const fail = (m) => {
          throw { at: i, m };
        };
        const str = () => {
          i++;
          while (i < t.length) {
            const ch = t[i];
            if (ch === '"') {
              i++;
              return;
            }
            if (ch === "\\") {
              const n = t[i + 1];
              if (n === "u") {
                if (!/^[0-9a-fA-F]{4}$/.test(t.slice(i + 2, i + 6)))
                  fail("Bad \\u escape in a string");
                i += 6;
              } else if (n !== undefined && '"\\/bfnrt'.includes(n)) i += 2;
              else fail("Bad escape in a string");
            } else if (ch < " ") fail("A line break or control character inside a string");
            else i++;
          }
          fail("A string is never closed");
        };
        const value = (depth) => {
          if (depth > MAX_DEPTH) fail("Nested too deeply");
          ws();
          const c = t[i];
          if (c === "{") {
            i++;
            ws();
            if (t[i] === "}") return void i++;
            for (;;) {
              ws();
              if (t[i] !== '"') fail("Expected a key in quotes");
              str();
              ws();
              if (t[i] !== ":") fail("Expected ':' after a key");
              i++;
              value(depth + 1);
              ws();
              if (t[i] === ",") i++;
              else if (t[i] === "}") return void i++;
              else fail("Expected ',' or '}'");
            }
          }
          if (c === "[") {
            i++;
            ws();
            if (t[i] === "]") return void i++;
            for (;;) {
              value(depth + 1);
              ws();
              if (t[i] === ",") i++;
              else if (t[i] === "]") return void i++;
              else fail("Expected ',' or ']'");
            }
          }
          if (c === '"') return str();
          const m = /^(-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?|true|false|null)/.exec(
            t.slice(i, i + 400),
          );
          if (!m) fail(c === undefined ? "The text ends too soon" : `Unexpected '${c}'`);
          i += m[0].length;
        };
        try {
          value(0);
          ws();
          if (i < t.length) fail("Text after the end of the value");
        } catch (e) {
          if (e && typeof e.at === "number") return e;
          return null;
        }
        return null;
      }

      /** Why the text isn't JSON, with a line and column when it can be found. */
      function explain(e, t) {
        const where = errorAt(t);
        if (where) {
          const before = t.slice(0, where.at);
          return {
            message: where.m,
            line: before.split("\n").length,
            col: where.at - before.lastIndexOf("\n"),
          };
        }
        return { message: String(e && e.message ? e.message : e), line: 0, col: 0 };
      }

      function load(t, trunc) {
        text = t.charCodeAt(0) === 0xfeff ? t.slice(1) : t;
        truncated = trunc;
        error = null;
        hasDoc = false;
        doc = undefined;
        list = [];
        selected = null;
        large = text.length > LARGE;
        expanded = new Set([pk([])]);
        windows = new Map();
        pretty = null;
        if (!truncated) {
          try {
            doc = JSON.parse(text);
            hasDoc = true;
          } catch (e) {
            error = explain(e, text);
            if (e instanceof RangeError || /too deeply/.test(String(e.message))) {
              error = { message: "Nested too deeply to show as a tree", line: 0, col: 0 };
            }
          }
        }
        $("m-tree").disabled = !hasDoc;
        $("m-pretty").disabled = !hasDoc || large;
        $("expand").disabled = $("collapse").disabled = !hasDoc;
        setMode(hasDoc ? "tree" : "raw");
      }

      function setMode(m) {
        mode = m;
        for (const name of ["tree", "pretty", "raw"]) {
          $(`m-${name}`).setAttribute("aria-pressed", String(name === m));
        }
        $("cpath").disabled = $("cvalue").disabled = m !== "tree" || !selected;
        render();
      }

      function render() {
        const top = $("top");
        top.replaceChildren();
        if (error) {
          const box = el("div", "callout");
          const where = error.line ? ` (line ${error.line}, column ${error.col})` : "";
          const b = el("b", null, "Not valid JSON");
          box.append(b, document.createTextNode(`: ${error.message}${where}`));
          top.append(box);
        } else if (truncated) {
          top.append(
            el(
              "div",
              "callout note",
              `This file is ${(fileSize / 1048576).toFixed(1)} MB, more than the ${MAX_FILE / 1048576} MB Folio reads here, so only its start is shown as text.`,
            ),
          );
        } else if (large) {
          top.append(
            el(
              "div",
              "callout note",
              `A large document (${(text.length / 1048576).toFixed(1)} MB): the Pretty view is off, and the Raw view shows the first ${MAX_LINES.toLocaleString("en-US")} lines.`,
            ),
          );
        }
        needle = query.value.toLowerCase();
        hits = [];
        current = -1;
        capped = false;
        searchRun++;
        if (mode === "tree") {
          renderTree();
          if (needle) return void findHits();
        } else {
          if (mode === "pretty" && pretty === null) pretty = JSON.stringify(doc, null, 2);
          renderText(mode === "pretty" ? pretty : text);
        }
        if (hits.length) go(0);
        else status();
      }

      /** `str` into `parent`, the search text marked. Marks are returned in order. */
      function marked(parent, str, marks) {
        if (!needle) {
          parent.append(str);
          return;
        }
        const hay = str.toLowerCase();
        let from = 0;
        let at;
        while ((at = hay.indexOf(needle, from)) !== -1) {
          if (at > from) parent.append(str.slice(from, at));
          const m = el("mark", null, str.slice(at, at + needle.length));
          parent.append(m);
          marks?.push(m);
          from = at + needle.length;
        }
        parent.append(str.slice(from));
      }

      // ---- Tree ----

      /** Looks through the whole document for the search text, in slices, and goes to the first. */
      async function findHits() {
        const run = ++searchRun;
        const r = await Json.search(doc, needle, MAX_HITS, {
          cancelled: () => run !== searchRun,
          visited: (n) => {
            $("count").textContent = `Searching… ${n.toLocaleString("en-US")} nodes`;
          },
        });
        if (!r) return;
        hits = r.found;
        capped = r.capped;
        current = -1;
        if (hits.length) go(0);
        else {
          drawRows();
          status();
        }
      }

      /** The open lines of the tree, as tall as all of them; only the ones in view are drawn. */
      function renderTree() {
        // Where the tree was, if it was showing; any other view starts at the top.
        const top = view.className === "tree" ? view.scrollTop : 0;
        const flat = Json.flatten(doc, expanded, windows, CHUNK);
        list = flat.list;
        lineIndex = flat.index;
        view.className = "tree";
        view.setAttribute("role", "tree");
        view.setAttribute("aria-label", "The document as a tree");
        const space = el("div", "space");
        space.style.height = `${list.length * ROW_H + 12}px`;
        view.replaceChildren(space);
        drawn = new Map();
        view.scrollTop = top;
        drawRows();
      }

      /** The rows that are in the page, by position in the list. */
      let drawn = new Map();

      /** Draws the lines in view and drops the ones that are not: the others stay as they are. */
      function drawRows() {
        const space = view.firstChild;
        if (mode !== "tree" || !space || !space.classList || !space.classList.contains("space"))
          return;
        const first = Math.max(0, Math.floor(view.scrollTop / ROW_H) - OVERSCAN);
        const last = Math.min(
          list.length,
          Math.ceil((view.scrollTop + view.clientHeight) / ROW_H) + OVERSCAN,
        );
        for (const [i, row] of drawn) {
          if (i < first || i >= last) {
            row.remove();
            drawn.delete(i);
          }
        }
        for (let i = first; i < last; i++) {
          if (drawn.has(i)) continue;
          const row = lineRow(list[i], i);
          drawn.set(i, row);
          space.append(row);
        }
        syncActive();
      }

      view.addEventListener("scroll", drawRows, { passive: true });
      window.addEventListener("resize", drawRows);

      /** Tells assistive technology which line is selected, if it is in the page. */
      function syncActive() {
        const at = selected ? lineIndex.get(selected.id) : undefined;
        if (at !== undefined && drawn.has(at))
          view.setAttribute("aria-activedescendant", `jr-${at}`);
        else view.removeAttribute("aria-activedescendant");
      }

      function spacer() {
        return el("span", "sp");
      }

      /** One line of the tree. */
      function lineRow(line, i) {
        const row = el("div", "row");
        row.id = `jr-${i}`;
        row.style.top = `${i * ROW_H + 6}px`;
        row.style.paddingLeft = `${line.depth * 18}px`;
        if (line.close) {
          row.setAttribute("role", "presentation");
          row.append(spacer(), (line.kind === "array" ? "]" : "}") + (line.last ? "" : ","));
          return row;
        }
        if (line.more || line.earlier) {
          row.setAttribute("role", "presentation");
          const n = Math.min(CHUNK, line.left);
          const move = el(
            "button",
            "more",
            line.more
              ? `Next ${n.toLocaleString("en-US")} (${line.left.toLocaleString("en-US")} more)`
              : `Previous ${n.toLocaleString("en-US")} (${line.left.toLocaleString("en-US")} before)`,
          );
          move.onclick = () => {
            const from = windows.get(line.of) ?? 0;
            windows.set(line.of, line.more ? from + CHUNK : Math.max(0, from - CHUNK));
            renderTree();
          };
          row.append(spacer(), move);
          return row;
        }
        const { id, key, v, kind: k, container, count, open } = line;
        row.dataset.id = id;
        row.setAttribute("role", "treeitem");
        row.setAttribute("aria-level", String(line.depth + 1));
        row.setAttribute("aria-posinset", String(i + 1));
        row.setAttribute("aria-setsize", String(list.length));
        row.setAttribute("aria-selected", String(!!selected && selected.id === id));
        if (container && count > 0) row.setAttribute("aria-expanded", String(open));
        if (selected && selected.id === id) row.classList.add("sel");
        if (hits[current] && pk(hits[current]) === id) row.classList.add("cur");
        if (container && count > 0) {
          const tg = el("button", "tg", open ? "▾" : "▸");
          tg.tabIndex = -1;
          tg.setAttribute("aria-label", open ? "Collapse" : "Expand");
          tg.onclick = (e) => {
            e.stopPropagation();
            toggle(id);
            view.focus({ preventScroll: true });
          };
          row.append(tg);
        } else {
          row.append(spacer());
        }
        if (key !== null) {
          const ks = el("span", "key");
          marked(ks, JSON.stringify(String(key)));
          row.append(ks, el("span", "colon", ":"));
        }
        if (container) {
          const [o, c] = k === "array" ? ["[", "]"] : ["{", "}"];
          if (count === 0) row.append(o + c);
          else if (open) row.append(o);
          else {
            row.append(`${o} … ${c}`);
            const unit = k === "array" ? "item" : "key";
            row.append(el("span", "meta", `${count} ${unit}${count === 1 ? "" : "s"}`));
          }
        } else {
          const shown = k === "string" ? JSON.stringify(v) : String(v);
          const clipped = shown.length > 600 ? `${shown.slice(0, 600)}…` : shown;
          const vs = el("span", k === "string" ? "str" : k === "number" ? "num" : "lit");
          marked(vs, clipped);
          if (shown.length > 600)
            vs.title = "The value is longer than what is shown here; Copy value gives all of it.";
          row.append(vs);
        }
        if (!line.last && !open) row.append(",");
        row.onclick = () => {
          select(line);
          view.focus({ preventScroll: true });
        };
        return row;
      }

      function toggle(id) {
        if (expanded.has(id)) expanded.delete(id);
        else expanded.add(id);
        renderTree();
      }

      /** Selects a node by its path, which is what copying uses: it need not be drawn. */
      function select(line) {
        selected = { id: line.id, path: line.path };
        $("cpath").disabled = $("cvalue").disabled = false;
        // Only the marks change: the rows stay, so a text selection or focus is not lost.
        for (const row of drawn.values()) {
          const on = row.dataset.id === line.id;
          row.classList.toggle("sel", on);
          if (row.dataset.id !== undefined) row.setAttribute("aria-selected", String(on));
        }
        syncActive();
      }

      /** Scrolls so that line `i` is in view. */
      function ensureVisible(i) {
        const y = i * ROW_H + 6;
        if (y < view.scrollTop) view.scrollTop = y - 6;
        else if (y + ROW_H > view.scrollTop + view.clientHeight) {
          view.scrollTop = y + ROW_H - view.clientHeight + 6;
        }
      }

      // Keys in the tree: the arrows move the selection, Right and Left open and close, Enter
      // opens or closes. Quick Look moves between files with the arrows: here they are the tree's.
      view.addEventListener("keydown", (e) => {
        if (mode !== "tree" || !list.length || e.target !== view) return;
        const node = (i, step) => {
          while (i >= 0 && i < list.length && list[i].id === undefined) i += step;
          return i >= 0 && i < list.length ? i : -1;
        };
        const at = selected ? (lineIndex.get(selected.id) ?? -1) : -1;
        const line = at >= 0 ? list[at] : null;
        const page = Math.max(1, Math.floor(view.clientHeight / ROW_H) - 1);
        let to = -1;
        switch (e.key) {
          case "ArrowDown":
            to = node(at + 1, 1);
            break;
          case "ArrowUp":
            to = at <= 0 ? 0 : node(at - 1, -1);
            break;
          case "PageDown":
            to = node(Math.min(list.length - 1, at + page), -1);
            break;
          case "PageUp":
            to = node(Math.max(0, at - page), 1);
            break;
          case "Home":
            to = node(0, 1);
            break;
          case "End":
            to = node(list.length - 1, -1);
            break;
          case "ArrowRight":
            if (line && line.container && line.count > 0 && !line.open)
              return void act(toggle, line);
            to = node(at + 1, 1);
            break;
          case "ArrowLeft":
            if (line && line.open) return void act(toggle, line);
            if (line && line.depth > 0) {
              let i = at - 1;
              while (i > 0 && (list[i].id === undefined || list[i].depth >= line.depth)) i--;
              to = i;
            }
            break;
          case "Enter":
          case " ":
            if (line && line.container && line.count > 0) return void act(toggle, line);
            break;
          default:
            return;
        }
        e.preventDefault();
        e.stopPropagation();
        if (to >= 0) {
          select(list[to]);
          ensureVisible(to);
          drawRows();
        }
        function act(fn, l) {
          e.preventDefault();
          e.stopPropagation();
          fn(l.id);
        }
      });

      /** Opens every level above `path` (and the batches that hold it), so its line exists. */
      function reveal(path) {
        let v = doc;
        for (let i = 0; i < path.length; i++) {
          const id = pk(path.slice(0, i));
          expanded.add(id);
          const index = Array.isArray(v) ? path[i] : Object.keys(v).indexOf(String(path[i]));
          // The window of members that holds it; only that many lines are made, however far in.
          windows.set(id, Math.floor(index / CHUNK) * CHUNK);
          v = v[path[i]];
        }
      }

      // ---- Text (pretty and raw) ----

      function renderText(str) {
        const { lines, more, clipped } = Json.firstLines(str, MAX_LINES, MAX_WIDTH);
        view.className = "text";
        view.removeAttribute("role");
        view.removeAttribute("aria-label");
        view.removeAttribute("aria-activedescendant");
        view.style.setProperty("--digits", String(String(lines.length).length));
        const frag = document.createDocumentFragment();
        const marks = [];
        lines.forEach((line, i) => {
          const row = el("div", error && error.line === i + 1 ? "line err" : "line");
          const t = el("span", "t");
          marked(t, line, marks.length < MAX_HITS ? marks : null);
          row.append(el("span", "n", String(i + 1)), t);
          frag.append(row);
        });
        if (clipped) {
          frag.append(
            el(
              "p",
              "msg",
              `Lines are cut at ${MAX_WIDTH.toLocaleString("en-US")} characters; the Pretty view shows a small document in full.`,
            ),
          );
        }
        if (more) frag.append(el("p", "msg", "… more lines are not shown"));
        view.replaceChildren(frag);
        hits = marks;
        const bad = view.querySelector(".line.err");
        if (bad && !needle) bad.scrollIntoView({ block: "center" });
      }

      // ---- Search ----

      function status() {
        let t = "";
        if (needle) {
          const more = capped || hits.length >= MAX_HITS ? "+" : "";
          t = hits.length ? `${current + 1} of ${hits.length}${more}` : "No matches";
        } else if (hasDoc) {
          const unit = Array.isArray(doc) ? "item" : "key";
          t = isContainer(doc)
            ? `${Object.keys(doc).length} ${unit}${Object.keys(doc).length === 1 ? "" : "s"} · ${text.length < 1048576 ? `${(text.length / 1024).toFixed(1)} KB` : `${(text.length / 1048576).toFixed(1)} MB`}`
            : kind(doc);
        }
        $("count").textContent = t;
      }

      function go(index) {
        if (!hits.length || (mode === "tree" && !hasDoc)) return;
        const was = hits[current];
        current = (index + hits.length) % hits.length;
        if (mode === "tree") {
          // Open what is above it and find its line: only the lines in view are drawn, so
          // however far it is, this is one pass over the open lines and a scroll.
          reveal(hits[current]);
          renderTree();
          const at = lineIndex.get(pk(hits[current]));
          const line = list[at];
          if (line) {
            selected = { id: line.id, path: line.path };
            $("cpath").disabled = $("cvalue").disabled = false;
            view.scrollTop = Math.max(0, at * ROW_H - view.clientHeight / 2);
            drawRows();
          }
        } else {
          was?.classList?.remove("cur");
          hits[current].classList.add("cur");
          hits[current].scrollIntoView({ block: "center", inline: "nearest" });
        }
        status();
      }

      let timer = 0;
      let shown = "";
      query.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          shown = query.value;
          render();
        }, 150);
      });
      query.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          clearTimeout(timer);
          if (hits.length && query.value === shown) go(current + (e.shiftKey ? -1 : 1));
          else if (query.value !== shown) {
            shown = query.value;
            render();
          }
        } else if (e.key === "Escape" && query.value) {
          e.preventDefault();
          e.stopPropagation();
          query.value = "";
          shown = "";
          render();
        }
      });
      $("next").onclick = () => go(current + 1);
      $("prev").onclick = () => go(current - 1);
      for (const m of ["tree", "pretty", "raw"]) $(`m-${m}`).onclick = () => setMode(m);
      $("expand").onclick = () => {
        // Not everything of a huge document: no deeper than 8 levels and 3,000 containers.
        for (const id of Json.openable(doc, 8, 3000, 200000, 150000, CHUNK)) expanded.add(id);
        setMode("tree");
      };
      $("collapse").onclick = () => {
        expanded = new Set([pk([])]);
        setMode("tree");
      };

      // ---- Copy ----

      let flash = 0;
      async function copy(str, what) {
        let ok = false;
        try {
          await navigator.clipboard.writeText(str);
          ok = true;
        } catch {
          // A sandboxed page may not be given the clipboard; the old way works on a click.
          const box = el("textarea");
          box.value = str;
          box.style.position = "fixed";
          box.style.opacity = "0";
          document.body.append(box);
          box.select();
          try {
            ok = document.execCommand("copy");
          } catch {
            ok = false;
          }
          box.remove();
        }
        $("count").textContent = ok ? `Copied ${what}` : "Could not copy";
        clearTimeout(flash);
        flash = setTimeout(status, 1500);
      }
      $("cpath").onclick = () => selected && copy(pathText(selected.path), "path");
      $("cvalue").onclick = () => {
        if (!selected) return;
        // From the document by path, so a node that is not drawn can be copied as well.
        const v = Json.valueAt(doc, selected.path);
        copy(typeof v === "string" ? v : JSON.stringify(v, null, 2), "value");
      };

      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") {
          e.preventDefault();
          query.focus();
          query.select();
        }
      });

      parent.postMessage({ folio: 1, event: "ready" }, "*");
    </script>
  </body>
</html>
