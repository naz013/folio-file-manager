name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Supersede outdated PR runs, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Linux runners are the cheapest minutes on private repos, so every push and PR
  # runs the bulk of the checks here.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! needs the frontend build directory to exist.
      - run: mkdir -p build
      - name: Rust fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Windows-only code (shell thumbnails, context menu, drag) is only compiled here,
  # so it also runs on PRs to catch FFI breakage before merge.
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: mkdir build
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # An unsigned Windows installer and the bare executable of every commit on main, kept as
  # run artifacts for trying a build without cutting a release. Pull requests skip it: it is
  # the slowest job. Releases (signed, with update files) are built by release.yml.
  build-windows:
    if: github.event_name != 'pull_request'
    needs: [frontend, rust-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the installer
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: folio-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/folio.exe
          if-no-files-found: error
          retention-days: 14
