name: Release

# Push a tag like v0.5.0 (it must match the version in tauri.conf.json) to build the
# installer and its signed update files. The release is created as a draft: nothing
# reaches users until you publish it on GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Tag matches the app version
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      # The notes the app shows after an update are the release's own: the body of the draft
      # release if one was written for the tag, else GitHub's generated notes. They are
      # built into the app so they show offline.
      - name: Bundle the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}"
      # The licenses of what is built in: shown in About and put next to the app. The build
      # fails here when a dependency has an unknown or not allowed license.
      - name: Collect the third-party licenses
        run: npm run licenses
      # Signing is on when the certificate secrets exist, and the build still works without
      # them (an unsigned installer, which SmartScreen warns about). The certificate is
      # imported for this job only; the runner is thrown away afterwards.
      - name: Prepare code signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $config = '{}'
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'folio.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            Remove-Item $pfx
            $config = @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = 'http://timestamp.digicert.com'
            } } } | ConvertTo-Json -Depth 5
            "SIGNED=true" >> $env:GITHUB_ENV
          } else {
            Write-Warning 'No WINDOWS_CERTIFICATE secret: this installer will NOT be signed.'
          }
          Set-Content -Path src-tauri/tauri.signing.conf.json -Value $config
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files. Without it the build fails: an unsigned update is
          # never accepted by the app.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Folio ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.signing.conf.json

      - name: Check the installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'No installer was built.' }
          $mb = [math]::Round($installer.Length / 1MB, 1)
          Write-Output "$($installer.Name): $mb MB"
          if ($installer.Length -ge 15MB) { throw "Installer is $mb MB; the limit is 15 MB." }
          if ($env:SIGNED -eq 'true') {
            foreach ($file in @($installer.FullName, 'src-tauri/target/release/folio.exe')) {
              $sig = Get-AuthenticodeSignature $file
              if ($sig.Status -ne 'Valid') { throw "$file is not signed correctly: $($sig.Status)" }
              if (-not $sig.TimeStamperCertificate) { throw "$file has no timestamp." }
            }
          }
