name: Release

# Push a tag like v0.5.0 (the build takes its version from the tag) to build the
# installer and its signed update files. The release is created as a draft: nothing
# reaches users until you publish it on GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Every platform job adds its files to the same draft release. They run at once, so the
  # draft is made here first; otherwise each could create its own.
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create the draft unless one exists for the tag
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].tag_name' \
            | grep -qx "${GITHUB_REF_NAME}"; then
            echo "A release for ${GITHUB_REF_NAME} exists."
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --draft --title "Folio ${GITHUB_REF_NAME}" --notes ""
          fi

  # macOS (one universal build for Apple silicon and Intel) and Linux. The macOS app and DMG are
  # signed and notarized when the Apple secrets exist (see docs/RELEASING.md); without them they
  # are built unsigned and Gatekeeper warns. The Linux packages are not signed.
  unix:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            target: universal-apple-darwin
            # A universal binary holds both architectures, so both are compiled.
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - name: Set the app version from the tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"
      - name: Bundle the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}"
      - name: Collect the third-party licenses
        run: npm run licenses
      # Signing and notarizing are on when all the Apple secrets exist. The certificate goes into
      # a keychain made for this job only (the runner is thrown away afterwards), and the
      # variables Tauri reads are set only then, so an unsigned build never sees empty ones.
      - name: Prepare macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set_count=0
          for v in "$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" "$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID"; do
            [ -n "$v" ] && set_count=$((set_count + 1))
          done
          if [ "$set_count" -eq 0 ]; then
            echo "::warning::No Apple secrets: this build will NOT be signed or notarized."
            exit 0
          fi
          # Some set and some not is a mistake, not a choice: do not ship an unsigned build by accident.
          if [ "$set_count" -ne 5 ]; then
            echo "Only $set_count of the 5 Apple secrets are set; set all of them or none."
            exit 1
          fi
          keychain="$RUNNER_TEMP/folio.keychain-db"
          keychain_password=$(uuidgen)
          echo "::add-mask::$keychain_password"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/folio.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/folio.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/folio.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -n 1 | sed -E 's/.*"(.*)"/\1/')
          [ -n "$identity" ] || { echo "No valid Developer ID Application certificate in the .p12 (missing, expired, or its certificate chain is not included)"; exit 1; }
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "NOTARIZED=true"
          } >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Folio ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: true
          # --bundles replaces the Windows-only "nsis" target of the release config.
          args: --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Tauri notarizes and staples the app, but builds the disk image from it afterwards, so the
      # image itself has no ticket. It is signed, submitted and stapled here, and the draft's copy
      # is replaced, because tauri-action has already uploaded the plain one.
      - name: Notarize the disk image
        if: runner.os == 'macOS' && env.NOTARIZED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -n 1)
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          # The asset has the same name, so --clobber replaces it in the draft.
          gh release upload "${GITHUB_REF_NAME}" "$dmg" --clobber

      # Fails the release if the app is not one binary for both architectures, or, when it was
      # signed, if the signature, the notarization ticket or Gatekeeper's verdict is not good. The
      # files are in the draft by now; a failure here turns the job red, and the draft is not to be
      # published.
      - name: Check the macOS app and disk image
        if: runner.os == 'macOS'
        run: |
          bundle=src-tauri/target/${{ matrix.target }}/release/bundle
          app="$bundle/macos/Folio.app"
          dmg=$(ls "$bundle"/dmg/*.dmg | head -n 1)
          [ -d "$app" ] && [ -n "$dmg" ] || { echo "No app or disk image was built."; exit 1; }
          exe=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
          archs=$(lipo -archs "$app/Contents/MacOS/$exe")
          echo "Architectures: $archs"
          case "$archs" in *arm64*) ;; *) echo "No Apple silicon code."; exit 1;; esac
          case "$archs" in *x86_64*) ;; *) echo "No Intel code."; exit 1;; esac
          if [ "$NOTARIZED" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            xcrun stapler validate "$dmg"
            spctl --assess --type execute --verbose=2 "$app"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          else
            echo "::warning::Not signed or notarized: Gatekeeper will warn."
          fi

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Set the app version from the tag
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"
      # The notes the app shows after an update are the release's own: the body of the draft
      # release if one was written for the tag, else GitHub's generated notes. They are
      # built into the app so they show offline.
      - name: Bundle the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}"
      # The licenses of what is built in: shown in About and put next to the app. The build
      # fails here when a dependency has an unknown or not allowed license.
      - name: Collect the third-party licenses
        run: npm run licenses
      # Signing is on when the certificate secrets exist, and the build still works without
      # them (an unsigned installer, which SmartScreen warns about). The certificate is
      # imported for this job only; the runner is thrown away afterwards.
      - name: Prepare code signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $config = '{}'
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'folio.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            Remove-Item $pfx
            $config = @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = 'http://timestamp.digicert.com'
            } } } | ConvertTo-Json -Depth 5
            "SIGNED=true" >> $env:GITHUB_ENV
          } else {
            Write-Warning 'No WINDOWS_CERTIFICATE secret: this installer will NOT be signed.'
          }
          Set-Content -Path src-tauri/tauri.signing.conf.json -Value $config
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files. Without it the build fails: an unsigned update is
          # never accepted by the app.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Folio ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.signing.conf.json

      - name: Check the installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'No installer was built.' }
          $mb = [math]::Round($installer.Length / 1MB, 1)
          Write-Output "$($installer.Name): $mb MB"
          if ($installer.Length -ge 15MB) { throw "Installer is $mb MB; the limit is 15 MB." }
          if ($env:SIGNED -eq 'true') {
            foreach ($file in @($installer.FullName, 'src-tauri/target/release/folio.exe')) {
              $sig = Get-AuthenticodeSignature $file
              if ($sig.Status -ne 'Valid') { throw "$file is not signed correctly: $($sig.Status)" }
              if (-not $sig.TimeStamperCertificate) { throw "$file has no timestamp." }
            }
          }
