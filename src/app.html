<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      A frame is only ever a plugin's page given as its document (about:srcdoc), never a link: a
      frame that could go to a plugin.localhost address would be trusted like this page by
      Tauri and could run Folio's commands. This also stops a plugin's frame from sending
      itself elsewhere, with data in the address. Do not add plugin addresses here.
    -->
    <meta http-equiv="Content-Security-Policy" content="frame-src about:" />
    <title>Folio</title>
    <script>
      // Set a forced theme before the first paint, so there is no flash of the other one.
      try {
        var theme = localStorage.getItem("folio.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
