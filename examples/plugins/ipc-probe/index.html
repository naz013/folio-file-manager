<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>IPC probe</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        font:
          13px system-ui,
          sans-serif;
      }
      ul {
        margin: 0;
        padding: 0;
      }
      li {
        list-style: none;
        margin: 4px 0;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(128, 128, 128, 0.12);
      }
      .bad {
        color: #c00;
        font-weight: 600;
        background: rgba(204, 0, 0, 0.12);
      }
      button {
        margin-top: 10px;
        padding: 6px 12px;
      }
    </style>
  </head>
  <body>
    <p>
      Tries to reach Folio's commands from a plugin page. Each line must say BLOCKED; a line saying
      REACHED is a hole in the sandbox.
    </p>
    <ul id="out"></ul>
    <script>
      const out = document.getElementById("out");
      function report(name, reached, detail) {
        const li = document.createElement("li");
        li.textContent = `${reached ? "REACHED" : "BLOCKED"}: ${name} (${detail})`;
        if (reached) li.className = "bad";
        out.append(li);
      }

      /** Runs one attempt: it passes when it throws or fails, and fails when it goes through. */
      async function attempt(name, fn) {
        try {
          const detail = await fn();
          if (detail === undefined) report(name, false, "not there");
          else report(name, true, String(detail));
        } catch (e) {
          report(name, false, e && e.name ? e.name : String(e));
        }
      }

      // Folio's own page: cross-origin and sandboxed, so any access must throw.
      attempt("parent.__TAURI_INTERNALS__", () => parent.__TAURI_INTERNALS__ && "object");
      attempt("parent.document", () => parent.document && "document");
      attempt("top.location.href", () => top.location.href);
      // The webview's message channel, with a forged command and no valid invoke key.
      attempt("chrome.webview.postMessage", () => {
        const w = window.chrome && window.chrome.webview;
        if (!w) return undefined;
        w.postMessage(
          JSON.stringify({
            cmd: "plugins_folder",
            callback: 1,
            error: 2,
            payload: {},
            __TAURI_INVOKE_KEY__: "guess",
          }),
        );
        // Not observable from here: check that nothing happens in Folio (no folder opens, no log).
        const li = document.createElement("li");
        li.textContent = "NOTE: a forged message was sent; Folio must ignore it (wrong invoke key)";
        out.append(li);
        return undefined;
      });
      // Tauri's own helper, which Windows puts in every frame. Its answer can't be seen from here
      // (it goes to Folio's page), so the sign is outside: an Explorer window on C:\Windows.
      {
        const t = window.__TAURI_INTERNALS__;
        const li = document.createElement("li");
        if (!t || typeof t.invoke !== "function") {
          li.textContent = "BLOCKED: __TAURI_INTERNALS__ is not in this frame, nothing was sent";
        } else {
          t.invoke("open_path", { path: "C:\\Windows" }).catch(() => {});
          li.textContent =
            "A command was sent to Folio. If Explorer opened on C:\\Windows, this Folio is not compatible with plugins (the sandbox is open); if nothing opened, it was refused.";
        }
        out.append(li);
      }
      // WebRTC reaches the network past the page's policy (STUN/TURN lookups), so a plugin page
      // must not have it.
      for (const name of ["RTCPeerConnection", "webkitRTCPeerConnection"]) {
        attempt(name, () =>
          typeof window[name] === "function" ? "constructor available" : undefined,
        );
      }
      // Tauri's custom-protocol channel: the policy must refuse the request.
      for (const url of ["http://ipc.localhost/plugins_folder", "ipc://localhost/plugins_folder"]) {
        attempt(`fetch ${url}`, async () => {
          const r = await fetch(url, { method: "POST", body: "{}" });
          return `status ${r.status}`;
        });
      }
      // Going to a plugin address would make the page trusted like Folio's own, so the app page
      // must refuse it. A refusal replaces this page with a "blocked" notice, so it waits for a
      // click. Only from the srcdoc page, so it can't loop.
      if (location.href === "about:srcdoc") {
        const btn = document.createElement("button");
        btn.textContent = "Try to leave for the plugin address (the page goes blank if refused)";
        btn.onclick = () => {
          location.href = new URL("index.html", document.baseURI).href;
        };
        document.body.append(btn);
      }
      // Tell Folio the page has loaded, so it does not show "did not respond".
      parent.postMessage({ folio: 1, event: "ready" }, "*");
    </script>
  </body>
</html>
